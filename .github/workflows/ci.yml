name: CI

# （GitHub Actions 不支援 YAML anchor，兩份清單只能各寫一次，改動時要同步。）
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tools/baker/**"
      - "contracts/**"
      - "apps/ios/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "tools/baker/**"
      - "contracts/**"
      - "apps/ios/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # assets/source 只有 baker job 需要（M1 才有）

      # toolchain 版本的 SSOT 是 rust-toolchain.toml，此處不指定版本
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # 鐵律 1／2 的守門：wgpu 只能出現在 render
      - name: lint-deps
        run: cargo xtask lint-deps

      - name: verify-generated
        run: cargo xtask verify-generated

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace


  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0 # paths-filter 在 push 事件要比對 before commit
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'core/engine/**'
              - 'apps/ios/**'
              # 改了 workflow 本身就讓 ios job 跑一次，否則這個 job 的設定沒人驗
              - '.github/workflows/ci.yml'

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      # iOS 兩個 target 寫在 rust-toolchain.toml，這行會一併裝起來
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: ios
        run: cargo xtask ios

      # xtask ios 會回寫 ffi-lock.toml。這裡有 diff 代表 commit 時忘了帶上它，
      # 或 macOS 與 Linux 的 bindgen 產物不一致——兩種都必須當場知道。
      - name: ffi-lock.toml 應保持乾淨
        run: git diff --exit-code core/engine/ffi-lock.toml
