[workspace]
resolver = "3"
members = ["core/*", "tools/baker", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- 內部（core/*）---
# 依賴方向由 xtask/deps-policy.toml 強制，見 docs/specs/build-infra.md
colorit-colorpack = { path = "core/colorpack" }
colorit-stroke = { path = "core/stroke" }
colorit-render = { path = "core/render" }
colorit-document = { path = "core/document" }
colorit-history = { path = "core/history" }
colorit-oplog = { path = "core/oplog" }
colorit-app-state = { path = "core/app-state" }
colorit-engine = { path = "core/engine" }

# --- 外部 ---
anyhow = "1"
bytemuck = "1.25"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
wgpu = "30"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
