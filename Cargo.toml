[workspace]
resolver = "3"
members = ["core/*", "tools/baker", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# --- 內部（core/*）---
# 依賴方向由 xtask/deps-policy.toml 強制，見 docs/specs/build-infra.md
colorlull-colorpack = { path = "core/colorpack" }
colorlull-stroke = { path = "core/stroke" }
colorlull-render = { path = "core/render" }
colorlull-document = { path = "core/document" }
colorlull-history = { path = "core/history" }
colorlull-oplog = { path = "core/oplog" }
colorlull-app-state = { path = "core/app-state" }
colorlull-engine = { path = "core/engine" }
colorlull-baker = { path = "tools/baker" }

# --- 外部 ---
anyhow = "1"
bytemuck = "1.25"
camino = "1"
clap = { version = "4.6", features = ["derive"] }
# zip 的 `deflate-flate2` 只開 dep，不選 backend——backend 要由使用端指定。
# 選 miniz_oxide（flate2 的 rust_backend）：純 Rust、無 C 依賴、輸出決定性。
flate2 = "1"
# baker 的 thumb.jpg（baker-core-design §3.7）。純 Rust baseline 編碼器，決定性。
jpeg-encoder = "0.7"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1.1"
wgpu = "30"
# deflate 後端寫死成 flate2（miniz_oxide），避免換後端就換掉 .colorpack 的位元。
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# --- 僅測試 ---
jsonschema = "0.49"
proptest = "1.11"
tempfile = "3"

# 版本一併記進 core/engine/ffi-lock.toml，見 docs/specs/ffi-contract.md §6。
uniffi = "=0.29.5"
uniffi_bindgen = "=0.29.5"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
