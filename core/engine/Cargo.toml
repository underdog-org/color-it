[package]
name = "colorlull-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "engine"
# staticlib 給 xcframework、cdylib 給 library-mode bindgen、lib 給 workspace 內的測試。
# 三種都要，見 docs/specs/ffi-contract.md §4。
crate-type = ["lib", "staticlib", "cdylib"]

[lints]
workspace = true

[dependencies]
colorlull-app-state = { workspace = true }
colorlull-colorpack = { workspace = true }
colorlull-document = { workspace = true }
colorlull-history = { workspace = true }
colorlull-render = { workspace = true }
thiserror = { workspace = true }
uniffi = { workspace = true }

[dev-dependencies]
# fixture 的 `.colorpack` 要有真的能解碼的線稿——`render` 端會真的去解它。
png = { workspace = true }
